        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2b66b17eda3c4a04d1f9a6f485c91b3d0892a07d
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: 22.x
          pnpm-version: 9.15.0
          cache-prefix: ghav-bb1846-app-3
