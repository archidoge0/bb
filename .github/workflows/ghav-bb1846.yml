# Isolated @bb/app test core of get-bb/bb #1846 on one fixed source tree.
name: GHAV bb 1846 app shards
on:
  push:
    branches:
      - codex/ghav-bb1846-*
permissions:
  contents: read
jobs:
  app-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout fixed historical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2b66b17eda3c4a04d1f9a6f485c91b3d0892a07d
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: 22.x
          pnpm-version: 9.15.0
          cache-prefix: ghav-bb1846-app-1
          turbo-cache: "false"
      - name: Run app tests
        run: pnpm exec turbo run test --filter=@bb/app --cache-dir=.turbo/cache --output-logs=new-only -- --shard=1/3
  app-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout fixed historical source
