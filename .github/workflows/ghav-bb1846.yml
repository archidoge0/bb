      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: 22.x
          pnpm-version: 9.15.0
          cache-prefix: ghav-bb1846-app-2
          turbo-cache: "false"
      - name: Run app tests
        run: pnpm exec turbo run test --filter=@bb/app --cache-dir=.turbo/cache --output-logs=new-only -- --shard=2/3
  app-3:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
