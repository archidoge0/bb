name: "ghav before: CI"
"on":
  push:
    branches:
      - ghav/dev/4687
    paths:
      - .ghav/before
env:
  PRIMARY_NODE_VERSION: 22.x
  PNPM_VERSION: 9.15.0
jobs:
  tests:
    name: Tests (${{ matrix.shard }}, ubuntu-latest, Node 22.x)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: server
            filter: --filter=@bb/server
            args: ""
          - shard: packages
            filter: --filter='!@bb/server' --filter='!@bb/app' --filter='!@bb/integration-tests' --filter='!bb-plugin-*'
            args: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup workspace tools
        uses: ./.github/actions/setup-workspace-tools
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - name: Restore workspace caches
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache-prefix: test-${{ matrix.shard }}
          turbo-cache: "true"
      - name: "ghav: discard restored Turbo cache"
        shell: bash
        run: rm -rf .turbo/cache
      - name: Install dependencies
        timeout-minutes: 5
        env:
          CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
        run: bash .github/actions/setup-workspace/install-dependencies.sh
      - name: Setup Bun
        if: ${{ matrix.shard == 'packages' || matrix.shard == 'plugins' }}
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14
          no-cache: true
      - name: Install Electron runtime libraries
        if: ${{ matrix.shard == 'packages' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64
          ELECTRON_RUN_AS_NODE=1 pnpm --filter @bb/desktop exec electron --version
      - name: Test
        run: ${{ matrix.shard == 'packages' && 'xvfb-run -a' || '' }} pnpm exec turbo run test ${{ matrix.filter }} --cache-dir="${TURBO_CACHE_DIR:-.turbo/cache}" --output-logs=new-only --summarize --concurrency=4 ${{ matrix.args }}
      - name: Upload test timings
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-timings-${{ matrix.shard }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
      - name: Bound saved Turbo cache
        run: node scripts/prune-turbo-cache.mjs --dir .turbo/cache --max-size-mb 1024
  plugin-forks:
    name: Plugin Fork Check (ubuntu-latest, Node 22.x)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select forkable plugins
        id: selection
        continue-on-error: true
        timeout-minutes: 2
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
          fi
          selection=$(node scripts/check-plugin-forks.mjs --changed-from="$BASE_SHA" --list)
          echo "count=$(node -e 'console.log(JSON.parse(process.argv[1]).length)' "$selection")" >> "$GITHUB_OUTPUT"
          echo "Forkable plugins: $selection" >> "$GITHUB_STEP_SUMMARY"
      - name: Setup workspace tools
        if: steps.selection.outputs.count != '0'
        uses: ./.github/actions/setup-workspace-tools
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
      - name: Restore workspace caches
        if: steps.selection.outputs.count != '0'
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache-prefix: plugin-forks
          turbo-cache: "true"
      - name: "ghav: discard restored Turbo cache"
        shell: bash
        run: rm -rf .turbo/cache
      - name: Install dependencies
        if: steps.selection.outputs.count != '0'
        timeout-minutes: 5
        env:
          CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
        run: bash .github/actions/setup-workspace/install-dependencies.sh
      - name: Setup Bun
        if: steps.selection.outputs.count != '0'
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14
          no-cache: true
      - name: Build, typecheck, and test forkable plugins outside the workspace
        if: steps.selection.outputs.count != '0'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-plugin-forks.mjs --changed-from="$BASE_SHA"
      - name: Bound saved Turbo cache
        if: steps.selection.outputs.count != '0'
        run: node scripts/prune-turbo-cache.mjs --dir .turbo/cache --max-size-mb 1024
